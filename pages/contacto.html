<main>
<section id="contacto" class="contacto-section">
    <div class="cardd">
        <!-- Barra ventana -->
    <div class="cardd-header">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="title-bar">Contacto</span>
    </div>

    <!-- Contenido -->
    <div class="cardd-body">
    <form action="https://formspree.io/f/xvgwdwbg" method="POST" class="contacto-form">

        <div class="campo">
            <label for="nombre">Nombre</label>
            <div class="input-icon">
                <span>👤</span>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre..." required>
            </div>
        </div>

        <div class="campo">
            <label for="email">Correo electrónico</label>
            <div class="input-icon">
                <span>📧</span>
                <input type="email" id="email" name="email" placeholder="tucorreo@gmail.com" required>
            </div>
        </div>

        <div class="campo">
            <label for="mensaje">Mensaje</label>
            <div class="input-icon textarea-icon">
                <span>💬</span>
                <textarea id="mensaje" name="mensaje" placeholder="Escribí tu mensaje..." required></textarea>
            </div>
        </div>

        <button type="submit" class="btn-enviar">Enviar mensaje</button>
    </form>
    </div>
    </div>
</section>
